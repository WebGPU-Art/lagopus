name: Prepare Lagopus published toolchain comparison
on:
  push:
    branches: [prepare/lagopus-paired-compatibility]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["0.30.1", "0.31.0-alpha.4"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          node paired-report.mjs pair '${{ matrix.version }}'
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve exact published graph
        run: |
          set -euo pipefail
          caps --strict --ci
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn install --immutable
          caps verify --toolchain
          node paired-report.mjs before '${{ matrix.version }}'
      - name: Original canonical guard
        id: canonical
        continue-on-error: true
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
      - name: Original all-definition check
        id: definitions
        continue-on-error: true
        run: |
          set -euo pipefail
          calcit calcit.cirru --check-only --all-defs --warn-dyn-method --format json | tee acceptance/definitions.json
      - name: Original complete strict workflow
        id: strict
        continue-on-error: true
        run: |
          set -euo pipefail
          calcit calcit.cirru fix --workflow strict --verify --format json | tee acceptance/strict.json
      - name: Original attached tests
        id: tests
        continue-on-error: true
        run: |
          set -euo pipefail
          calcit calcit.cirru test --require-match --summary-only --format json | tee acceptance/tests.json
      - name: Original eighteen public namespace check
        id: public
        continue-on-error: true
        run: |
          set -euo pipefail
          calcit calcit.cirru --check-only --ns lagopus.alias --ns lagopus.browser --ns lagopus.comp.button --ns lagopus.comp.container --ns lagopus.comp.cube --ns lagopus.comp.curves --ns lagopus.comp.image --ns lagopus.comp.plate --ns lagopus.comp.sphere --ns lagopus.comp.spots --ns lagopus.comp.stitch --ns lagopus.config --ns lagopus.cursor --ns lagopus.gpu --ns lagopus.main --ns lagopus.math --ns lagopus.runtime --ns lagopus.util --summary-only --format json | tee acceptance/public.json
      - name: Original frontend build without GPU execution
        id: build
        continue-on-error: true
        env:
          VITE_BASE_URL: ./
        run: |
          set -euo pipefail
          yarn build 2>&1 | tee acceptance/build.log
      - name: Verify unchanged full source views
        id: source
        if: always()
        continue-on-error: true
        run: node paired-report.mjs after '${{ matrix.version }}'
      - name: Enforce every original gate outcome
        if: always()
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
          DEFINITIONS: ${{ steps.definitions.outcome }}
          STRICT: ${{ steps.strict.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PUBLIC: ${{ steps.public.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SOURCE: ${{ steps.source.outcome }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict";const names=["CANONICAL","DEFINITIONS","STRICT","TESTS","PUBLIC","BUILD","SOURCE"];for(const name of names){console.log(name,process.env[name]);}for(const name of names)assert.equal(process.env[name],"success",name+" must pass; diagnostic continuation is not a gate waiver");'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lagopus-paired-${{ matrix.version }}
          path: acceptance
          if-no-files-found: error
          retention-days: 30
